<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiPlay settings</title>
<style>
:root { color-scheme: dark; }
body { margin:0; padding:24px 20px 40px; background:#101418; color:#e8eaed;
  font:16px/1.5 -apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif; }
main { max-width:520px; margin:0 auto; }
h1 { font-size:22px; margin:0 0 4px; }
p.sub { color:#9aa0a6; margin:0 0 24px; }
.card { background:#1b2129; border:1px solid #2a323d; border-radius:16px; padding:18px; margin-bottom:16px; }
.card h2 { font-size:16px; margin:0 0 6px; }
.card p { color:#9aa0a6; font-size:14px; margin:0 0 14px; }
a.btn,button { display:block; width:100%; box-sizing:border-box; text-align:center; padding:13px 16px;
  border-radius:999px; border:0; font-size:16px; font-weight:600; cursor:pointer; text-decoration:none;
  background:#a8c7fa; color:#0b2540; }
button:disabled { opacity:.5; }
#reportRange { display:block; width:100%; max-width:100%; min-width:0; min-height:48px;
  box-sizing:border-box; margin:0 0 12px; padding:10px; border:1px solid #2a323d;
  border-radius:12px; background:#101418; color:#e8eaed; font:inherit; }
#result { margin-top:12px; font-size:14px; color:#9aa0a6; min-height:20px; white-space:pre-line; }
#result.err { color:#f28b82; }
input[type=file] { display:none; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="card">
    <h2 id="exportTitle"></h2>
    <p id="exportText"></p>
    <a class="btn" id="exportBtn" href="export" download></a>
  </div>
  <div class="card">
    <h2 id="importTitle"></h2>
    <p id="importText"></p>
    <button id="importBtn"></button>
    <input type="file" id="file" accept="application/json,.json">
    <div id="result"></div>
  </div>
  <div class="card" id="report">
    <h2 id="reportTitle"></h2>
    <p id="reportText"></p>
    <select id="reportRange" aria-label="Report selection"></select>
    <p id="reportSelectionDetail" aria-live="polite" style="overflow-wrap:anywhere"></p>
    <a class="btn" id="reportBtn" href="report?selection=all" download></a>
    <p id="reportStatus" role="status"></p>
  </div>
</main>
<script>
var L = {
  en: {title:"DiPlay settings",sub:"Back up or restore DiPlay settings on this phone.",
    exportTitle:"Export",exportText:"Save the current settings of this head unit as a file.",export:"Export settings",
    importTitle:"Import",importText:"Load a settings file exported from a DiPlay head unit. Settings missing from the file keep their current value.",
    picking:"Reading file…",invalid:"This file is not a DiPlay settings backup.",
    open:"Choose file and import",
    done:"Imported %1 settings, skipped %2.",fail:"Import failed. Check the connection and try again.",
    reportTitle:"Diagnostic report",reportText:"Save this head unit's diagnostic report as a ZIP archive, including retained original logs and saved network diagnostics.",report:"Download report"},
  zh: {title:"DiPlay 设置",sub:"在手机上备份或恢复 DiPlay 设置。",
    exportTitle:"导出",exportText:"将这台车机的当前设置保存为文件。",export:"导出设置",
    importTitle:"导入",importText:"载入从 DiPlay 车机导出的设置文件。文件中缺失的配置项保持当前值。",
    picking:"正在读取文件…",invalid:"这不是 DiPlay 设置备份文件。",
    open:"选择文件并导入",
    done:"已导入 %1 项设置，跳过 %2 项。",fail:"导入失败，请检查连接后重试。",
    reportTitle:"诊断报告",reportText:"将这台车机的诊断报告保存为ZIP归档，包含保留的原始日志和已采集的网络诊断。",report:"下载报告"},
  "zh-TW": {title:"DiPlay 設定",sub:"在手機上備份或還原 DiPlay 設定。",
    exportTitle:"匯出",exportText:"將這台車機的目前設定儲存為檔案。",export:"匯出設定",
    importTitle:"匯入",importText:"載入從 DiPlay 車機匯出的設定檔。檔案中缺少的設定項目保持目前值。",
    picking:"正在讀取檔案…",invalid:"這不是 DiPlay 設定備份檔。",
    open:"選擇檔案並匯入",
    done:"已匯入 %1 項設定，略過 %2 項。",fail:"匯入失敗，請檢查連線後重試。",
    reportTitle:"診斷報告",reportText:"將這台車機的診斷報告儲存為ZIP封存檔，包含保留的原始日誌和已擷取的網路診斷。",report:"下載報告"},
  es: {title:"Ajustes de DiPlay",sub:"Copia o restaura los ajustes de DiPlay en este teléfono.",
    exportTitle:"Exportar",exportText:"Guarda los ajustes actuales de esta unidad en un archivo.",export:"Exportar ajustes",
    importTitle:"Importar",importText:"Carga un archivo de ajustes exportado de una unidad DiPlay. Los ajustes ausentes conservan su valor.",
    picking:"Leyendo archivo…",invalid:"Este archivo no es una copia de seguridad de DiPlay.",
    open:"Elegir archivo e importar",
    done:"Importados %1 ajustes, omitidos %2.",fail:"No se pudo importar. Comprueba la conexión.",
    reportTitle:"Informe de diagnóstico",reportText:"Guarda el informe como archivo ZIP, incluidos los registros originales conservados y los diagnósticos de red guardados.",report:"Descargar informe"},
  ru: {title:"Настройки DiPlay",sub:"Резервная копия или восстановление настроек DiPlay на этом телефоне.",
    exportTitle:"Экспорт",exportText:"Сохранить текущие настройки этого устройства в файл.",export:"Экспорт настроек",
    importTitle:"Импорт",importText:"Загрузите файл настроек, экспортированный с устройства DiPlay. Отсутствующие настройки сохранят текущие значения.",
    picking:"Чтение файла…",invalid:"Этот файл не является резервной копией настроек DiPlay.",
    open:"Выбрать файл и импортировать",
    done:"Импортировано настроек: %1, пропущено: %2.",fail:"Не удалось импортировать. Проверьте подключение.",
    reportTitle:"Диагностический отчёт",reportText:"Сохранить диагностический отчёт в ZIP-архив, включая сохранённые исходные журналы и диагностику сети.",report:"Скачать отчёт"},
  uk: {title:"Налаштування DiPlay",sub:"Резервна копія або відновлення налаштувань DiPlay на цьому телефоні.",
    exportTitle:"Експорт",exportText:"Зберегти поточні налаштування цього пристрою у файл.",export:"Експорт налаштувань",
    importTitle:"Імпорт",importText:"Завантажте файл налаштувань, експортований з пристрою DiPlay. Відсутні налаштування збережуть поточні значення.",
    picking:"Читання файлу…",invalid:"Цей файл не є резервною копією налаштувань DiPlay.",
    open:"Вибрати файл та імпортувати",
    done:"Імпортовано налаштувань: %1, пропущено: %2.",fail:"Не вдалося імпортувати. Перевірте з'єднання.",
    reportTitle:"Діагностичний звіт",reportText:"Зберегти діагностичний звіт у ZIP-архів, включно зі збереженими початковими журналами та діагностикою мережі.",report:"Завантажити звіт"},
  ar: {title:"إعدادات DiPlay",sub:"نسخ احتياطي أو استعادة إعدادات DiPlay على هذا الهاتف.",
    exportTitle:"تصدير",exportText:"حفظ الإعدادات الحالية لهذه الوحدة في ملف.",export:"تصدير الإعدادات",
    importTitle:"استيراد",importText:"حمّل ملف إعدادات تم تصديره من وحدة DiPlay. الإعدادات غير الموجودة تحتفظ بقيمتها.",
    picking:"جارٍ قراءة الملف…",invalid:"هذا الملف ليس نسخة احتياطية لإعدادات DiPlay.",
    open:"اختيار ملف واستيراده",
    done:"تم استيراد %1 من الإعدادات، وتجاهل %2.",fail:"فشل الاستيراد. تحقق من الاتصال وأعد المحاولة.",
    reportTitle:"تقرير التشخيص",reportText:"حفظ تقرير التشخيص في أرشيف ZIP، بما في ذلك السجلات الأصلية المحتفظ بها وتشخيصات الشبكة المحفوظة.",report:"تنزيل التقرير"},
  ja: {title:"DiPlay の設定",sub:"このスマートフォンで DiPlay の設定をバックアップまたは復元します。",
    exportTitle:"エクスポート",exportText:"この車載端末の現在の設定をファイルに保存します。",export:"設定をエクスポート",
    importTitle:"インポート",importText:"DiPlay の車載端末からエクスポートした設定ファイルを読み込みます。ファイルにない設定は現在の値のままです。",
    picking:"ファイルを読み込んでいます…",invalid:"このファイルは DiPlay の設定バックアップではありません。",
    open:"ファイルを選んでインポート",
    done:"%1 件の設定をインポートし、%2 件をスキップしました。",fail:"インポートできませんでした。接続を確認してもう一度お試しください。",
    reportTitle:"診断レポート",reportText:"診断レポートをZIPアーカイブとして保存します。保持されている元のログと保存済みのネットワーク診断が含まれます。",report:"レポートをダウンロード"},
  it: {title:"Impostazioni DiPlay",sub:"Esegui il backup o ripristina le impostazioni di DiPlay su questo telefono.",
    exportTitle:"Esporta",exportText:"Salva in un file le impostazioni attuali di questa head unit.",export:"Esporta impostazioni",
    importTitle:"Importa",importText:"Carica un file di impostazioni esportato da una head unit DiPlay. Le impostazioni assenti dal file mantengono il valore attuale.",
    picking:"Lettura del file…",invalid:"Questo file non è un backup delle impostazioni di DiPlay.",
    open:"Scegli il file e importa",
    done:"Importate %1 impostazioni, saltate %2.",fail:"Importazione non riuscita. Controlla la connessione e riprova.",
    reportTitle:"Report diagnostico",reportText:"Salva il report diagnostico come archivio ZIP, inclusi i registri originali conservati e la diagnostica di rete salvata.",report:"Scarica report"}
};
var lang = (navigator.language || "en").toLowerCase();
var key = lang in L ? lang
  : lang.indexOf("zh") === 0 ? (lang.indexOf("tw") > 0 || lang.indexOf("hk") > 0 || lang.indexOf("hant") > 0 ? "zh-TW" : "zh")
  : lang.indexOf("es") === 0 ? "es"
  : lang.indexOf("ru") === 0 ? "ru"
  : lang.indexOf("uk") === 0 ? "uk"
  : lang.indexOf("ar") === 0 ? "ar"
  : lang.indexOf("ja") === 0 ? "ja"
  : lang.indexOf("it") === 0 ? "it" : "en";
var t = L[key];
var $ = function(id) { return document.getElementById(id); };
document.title = t.title;
document.documentElement.lang = key;
$("title").textContent = t.title;
$("sub").textContent = t.sub;
$("exportTitle").textContent = t.exportTitle;
$("exportText").textContent = t.exportText;
$("exportBtn").textContent = t.export;
$("importTitle").textContent = t.importTitle;
$("importText").textContent = t.importText;
$("importBtn").textContent = t.open;
$("reportTitle").textContent = t.reportTitle;
$("reportText").textContent = t.reportText;
$("reportBtn").textContent = t.report;
$("reportRange").setAttribute("aria-label", t.reportTitle);
var rangeLabels = {"en": ["Today", "Yesterday", "Last 7 days", "All retained sessions", "Choose a session (device date may be wrong)"], "zh": ["今天", "昨天", "最近7天", "所有保留的会话", "选择会话（设备日期可能不准确）"], "zh-TW": ["今天", "昨天", "最近7天", "所有保留的工作階段", "選擇工作階段（裝置日期可能不正確）"], "es": ["Hoy", "Ayer", "Últimos 7 días", "Todas las sesiones conservadas", "Elegir sesión (la fecha puede ser incorrecta)"], "it": ["Oggi", "Ieri", "Ultimi 7 giorni", "Tutte le sessioni conservate", "Scegli sessione (la data potrebbe essere errata)"], "ru": ["Сегодня", "Вчера", "Последние 7 дней", "Все сохранённые сеансы", "Выбрать сеанс (дата может быть неверной)"], "uk": ["Сьогодні", "Учора", "Останні 7 днів", "Усі збережені сеанси", "Вибрати сеанс (дата може бути хибною)"], "ja": ["今日", "昨日", "過去7日間", "保持中の全セッション", "セッションを選択（端末の日付が不正確な場合）"], "ar": ["اليوم", "أمس", "آخر 7 أيام", "كل الجلسات المحفوظة", "اختيار جلسة (قد يكون تاريخ الجهاز خاطئًا)"]};
var labels = rangeLabels[key] || rangeLabels.en;
["today", "yesterday", "7days", "all"].forEach(function(value, index) {
  var option = document.createElement("option"); option.value = value; option.textContent = labels[index];
  $("reportRange").appendChild(option);
});
$("reportRange").value = "all";
$("reportRange").addEventListener("change", function() {
  $("reportBtn").href = "report?selection=" + encodeURIComponent(this.value);
  $("reportSelectionDetail").textContent = this.options[this.selectedIndex].textContent;
});
var reportPending = {"en": "Download requested. The head unit generates and streams the ZIP directly. Check browser Downloads for completion; if it fails, tap Download report again.", "zh": "已请求下载。车机会直接生成并传输 ZIP，无需在车机保存临时整包；请在浏览器下载列表确认完成。若失败，请再次点击下载报告。", "zh-TW": "已要求下載。車機會直接產生並傳送 ZIP，無需在車機儲存暫存整包；請在瀏覽器下載清單確認完成。若失敗，請再次點擊下載報告。", "es": "Descarga solicitada. La unidad genera y transmite el ZIP directamente. Comprueba Descargas del navegador; si falla, pulsa Descargar informe otra vez.", "it": "Download richiesto. La unità genera e trasmette lo ZIP direttamente. Controlla i download del browser; in caso di errore riprova con Scarica report.", "ru": "Загрузка запрошена. Устройство создаёт и передаёт ZIP напрямую. Проверьте загрузки браузера; при ошибке нажмите скачать ещё раз.", "uk": "Завантаження запитано. Пристрій створює та передає ZIP безпосередньо. Перевірте завантаження браузера; у разі помилки натисніть ще раз.", "ja": "ダウンロードを要求しました。車載機がZIPを生成しながら直接送信します。ブラウザーのダウンロード一覧で完了を確認し、失敗した場合は再度押してください。", "ar": "تم طلب التنزيل. ينشئ الجهاز ملف ZIP ويرسله مباشرة. تحقق من اكتماله في تنزيلات المتصفح؛ إذا فشل، اضغط تنزيل التقرير مرة أخرى."};
$("reportBtn").addEventListener("click", function() { $("reportStatus").textContent = reportPending[key] || reportPending.en; });
fetch("sessions").then(function(response) { if (!response.ok) throw 0; return response.text(); }).then(function(body) {
  body.split("\n").forEach(function(line) {
    var fields = line.split("\t");
    if (!/^[0-9a-f-]{36}$/.test(fields[0])) return;
    var option = document.createElement("option"); option.value = fields[0]; option.textContent = labels[4] + " · " + fields.slice(1).join(" ");
    $("reportRange").appendChild(option);
  });
}).catch(function() {});
document.documentElement.dir = key === "ar" ? "rtl" : "ltr";
$("importBtn").addEventListener("click", function() { $("file").click(); });
$("file").addEventListener("change", function() {
  var file = this.files[0];
  if (!file) return;
  $("result").className = "";
  $("result").textContent = t.picking;
  $("importBtn").disabled = true;
  var reader = new FileReader();
  reader.onload = function() {
    fetch("import", {method: "POST", headers: {"Content-Type": "application/json"}, body: reader.result})
      .then(function(r) { if (!r.ok) throw 0; return r.json(); })
      .then(function(j) {
        if (j.invalid) { $("result").className = "err"; $("result").textContent = t.invalid; }
        else $("result").textContent = t.done.replace("%1", j.applied).replace("%2", j.skipped);
      })
      .catch(function() { $("result").className = "err"; $("result").textContent = t.fail; })
      .finally(function() { $("importBtn").disabled = false; $("file").value = ""; });
  };
  reader.readAsText(file);
});
</script>
</body>
</html>
